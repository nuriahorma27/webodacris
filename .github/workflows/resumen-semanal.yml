name: Resumen semanal de respuestas

on:
  schedule:
    - cron: '0 8 * * 1' # lunes 08:00 UTC (10:00 en verano, 09:00 en invierno)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a la web que envíe el Excel por email
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$SITE_URL/api/resumen-semanal" -H "x-cron-secret: $CRON_SECRET"
