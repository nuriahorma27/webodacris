<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Respuestas · Boda Cris y Pela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root{--paper:#f7f0e2;--green:#737b54;--dark:#536048;--line:rgba(115,123,84,.3)}
      *{box-sizing:border-box}
      [hidden]{display:none!important}
      body{margin:0;min-height:100vh;color:var(--dark);background:var(--paper);font:400 14px/1.5 "DM Sans",system-ui,sans-serif}
      h1,h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500}
      button{font:inherit;cursor:pointer}
      .login{min-height:100vh;display:grid;place-items:center;padding:24px}
      .login form{width:min(360px,100%);padding:38px 32px;background:#faf5e9;border:1px solid var(--line);box-shadow:0 8px 22px rgba(76,67,48,.08)}
      .login h1{margin-bottom:24px;font-size:36px;text-align:center}
      label{display:block;margin-bottom:16px}
      label span{display:block;margin-bottom:5px;font:italic 500 17px "Cormorant Garamond",Georgia,serif}
      input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;color:var(--dark);background:#fffdf7;font:inherit}
      input:focus{outline:2px solid var(--green);outline-offset:1px}
      .primary{width:100%;padding:11px 20px;border:1px solid var(--green);border-radius:2px;color:var(--paper);background:var(--green);font:500 17px "Cormorant Garamond",Georgia,serif}
      .secondary{padding:9px 18px;border:1px solid var(--green);border-radius:2px;color:var(--green);background:transparent;font:500 16px "Cormorant Garamond",Georgia,serif}
      .primary:disabled,.secondary:disabled{opacity:.55;cursor:wait}
      .back{display:inline-block;color:var(--green);font:italic 500 17px "Cormorant Garamond",Georgia,serif;text-decoration:none;border-bottom:1px solid var(--line)}
      .back:hover{border-color:var(--green)}
      .login .back{display:block;width:fit-content;margin:18px auto 0}
      .panel>.back{margin-bottom:18px}
      .error{min-height:1.5em;margin:12px 0 0;color:#9a4a3a;text-align:center}
      .panel{padding:32px clamp(16px,4vw,48px)}
      .panel-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:24px}
      .panel-head h1{font-size:40px}
      .actions{display:flex;gap:10px;flex-wrap:wrap}
      .actions .primary{width:auto}
      .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
      .stat{padding:14px 16px;background:#faf5e9;border:1px solid var(--line)}
      .stat strong{display:block;font:500 30px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--green)}
      .stat span{font-size:12px}
      .table-wrap{overflow-x:auto;background:#fffdf7;border:1px solid var(--line)}
      table{width:100%;border-collapse:collapse;font-size:13px}
      th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
      td.long{min-width:200px;white-space:normal}
      th{position:sticky;top:0;color:var(--paper);background:var(--green);font-weight:500}
      tbody tr:nth-child(even){background:rgba(115,123,84,.05)}
      .empty{padding:30px;text-align:center;font:italic 18px "Cormorant Garamond",Georgia,serif}
      td.actions-cell{position:sticky;left:0;z-index:1;background:#fffdf7}
      tbody tr:nth-child(even) td.actions-cell{background:#f8f5ec}
      th:first-child{position:sticky;left:0;z-index:2}
      .delete{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:3px;color:#9a4a3a;background:transparent}
      .delete:hover{border-color:rgba(154,74,58,.4);background:rgba(154,74,58,.08)}
      .delete svg{width:17px;height:17px}
      td.actions-cell{width:1%;padding:4px 8px;vertical-align:middle}
      .confirm{width:min(400px,calc(100% - 32px));padding:28px 26px;border:1px solid var(--line);color:var(--dark);background:#faf5e9;box-shadow:0 12px 36px rgba(52,67,52,.18)}
      .confirm::backdrop{background:rgba(52,67,52,.35)}
      .confirm h2{margin-bottom:10px;font-size:28px}
      .confirm p{margin:0 0 22px}
      .confirm .buttons{display:flex;gap:10px;justify-content:flex-end}
      .danger{padding:9px 18px;border:1px solid #9a4a3a;border-radius:2px;color:#fff;background:#9a4a3a;font:500 16px "Cormorant Garamond",Georgia,serif}
    </style>
  </head>
  <body>
    <main class="login" id="login-view">
      <form id="login-form">
        <h1>Respuestas</h1>
        <label><span>Usuario</span><input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
        <label><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
        <button class="primary" type="submit">Entrar</button>
        <p class="error" id="login-error" role="alert"></p>
        <a class="back" href="/">← Volver a la web</a>
      </form>
    </main>

    <main class="panel" id="panel-view" hidden>
      <a class="back" href="/">← Volver a la web</a>
      <div class="panel-head">
        <h1>Respuestas del formulario</h1>
        <div class="actions">
          <button class="primary" id="export" type="button">Exportar Excel</button>
          <button class="secondary" id="refresh" type="button">Actualizar</button>
          <button class="secondary" id="logout" type="button">Cerrar sesión</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="table-wrap"><table id="table"></table></div>
      <dialog class="confirm" id="confirm">
        <h2>¿Seguro que quieres eliminarlo?</h2>
        <p id="confirm-text"></p>
        <div class="buttons"><button class="secondary" id="confirm-cancel" type="button">Cancelar</button><button class="danger" id="confirm-ok" type="button">Eliminar</button></div>
      </dialog>
    </main>

    <script>
      const loginView = document.querySelector('#login-view');
      const panelView = document.querySelector('#panel-view');
      const loginError = document.querySelector('#login-error');
      const exportButton = document.querySelector('#export');
      const LONG_FIELDS = ['direccion', 'alergias'];
      let credentials = sessionStorage.getItem('boda-admin') || '';
      let currentRows = [];
      let pendingDelete = null;
      const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

      const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const api = (query = '') => fetch(`/api/respuestas${query}`, { headers: { 'x-admin-auth': credentials } });

      function showLogin(message = '') {
        panelView.hidden = true;
        loginView.hidden = false;
        loginError.textContent = message;
      }

      function render({ columns, rows, summary }) {
        currentRows = rows;
        const stats = [
          [summary.respuestas, 'respuestas'],
          [summary.personas, 'personas asisten (con acompañantes)'],
          [summary.noAsisten, 'no asisten'],
          [summary.idaGijon + ' / ' + summary.idaOviedo, 'bus de ida Gijón / Oviedo'],
          [summary.vueltaGijon + ' / ' + summary.vueltaOviedo, 'bus de vuelta Gijón / Oviedo']
        ];
        document.querySelector('#stats').innerHTML = stats.map(([n, label]) => `<div class="stat"><strong>${n}</strong><span>${label}</span></div>`).join('');
        document.querySelector('#table').innerHTML = rows.length
          ? `<thead><tr><th></th>${columns.map(([, label]) => `<th>${label}</th>`).join('')}</tr></thead>
             <tbody>${rows.map((row, i) => `<tr><td class="actions-cell"><button class="delete" type="button" data-index="${i}" aria-label="Eliminar" title="Eliminar">${TRASH}</button></td>${columns.map(([key]) => `<td${LONG_FIELDS.includes(key) ? ' class="long"' : ''}>${escapeHtml(row[key])}</td>`).join('')}</tr>`).join('')}</tbody>`
          : '<tbody><tr><td class="empty">Todavía no ha llegado ninguna respuesta.</td></tr></tbody>';
        loginView.hidden = true;
        panelView.hidden = false;
      }

      async function load() {
        const res = await api();
        if (res.status === 401) {
          sessionStorage.removeItem('boda-admin');
          credentials = '';
          return showLogin('Usuario o contraseña incorrectos.');
        }
        if (!res.ok) return showLogin('No se han podido cargar las respuestas. Inténtalo más tarde.');
        render(await res.json());
      }

      document.querySelector('#login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector('button');
        credentials = btoa(unescape(encodeURIComponent(`${form.user.value.trim()}:${form.password.value}`)));
        sessionStorage.setItem('boda-admin', credentials);
        button.disabled = true;
        loginError.textContent = '';
        await load();
        button.disabled = false;
        form.password.value = '';
      });

      document.querySelector('#refresh').addEventListener('click', load);

      const confirmDialog = document.querySelector('#confirm');
      document.querySelector('#table').addEventListener('click', event => {
        const button = event.target.closest('.delete');
        if (!button) return;
        const row = currentRows[button.dataset.index];
        const name = `${row.nombre} ${row.apellidos}`.trim() || 'esta persona';
        const companion = row.persona === 'invitado' && currentRows.find(r => r.id === row.id && r.persona === 'acompanante');
        document.querySelector('#confirm-text').textContent = row.persona === 'acompanante'
          ? `Se eliminará a ${name} como acompañante de ${row['acompanante-de']}. La respuesta de ${row['acompanante-de']} se mantiene.`
          : companion
            ? `Se eliminará la respuesta de ${name} y la de su acompañante, ${companion.nombre} ${companion.apellidos}.`
            : `Se eliminará la respuesta de ${name}.`;
        pendingDelete = row;
        confirmDialog.showModal();
      });
      document.querySelector('#confirm-cancel').addEventListener('click', () => confirmDialog.close());
      document.querySelector('#confirm-ok').addEventListener('click', async event => {
        const button = event.currentTarget;
        button.disabled = true;
        const res = await fetch(`/api/respuestas/${pendingDelete.id}?persona=${pendingDelete.persona}`, { method: 'DELETE', headers: { 'x-admin-auth': credentials } });
        button.disabled = false;
        confirmDialog.close();
        if (!res.ok && res.status !== 404) return alert('No se ha podido eliminar. Inténtalo de nuevo.');
        load();
      });

      document.querySelector('#logout').addEventListener('click', () => {
        sessionStorage.removeItem('boda-admin');
        credentials = '';
        showLogin();
      });

      exportButton.addEventListener('click', async () => {
        exportButton.disabled = true;
        const res = await api('?format=xlsx');
        exportButton.disabled = false;
        if (!res.ok) return alert('No se ha podido exportar el Excel.');
        const url = URL.createObjectURL(await res.blob());
        const link = Object.assign(document.createElement('a'), { href: url, download: `respuestas-boda-${new Date().toISOString().slice(0, 10)}.xlsx` });
        link.click();
        URL.revokeObjectURL(url);
      });

      if (credentials) load();
    </script>
  </body>
</html>
