<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="vp" content="width=device-width, initial-scale=1.0" />
    <script>try{if(localStorage.getItem("boda-modo")==="ordenador")document.getElementById("vp").content="width=1200"}catch(e){}</script>
    <meta name="robots" content="noindex, nofollow" />
    <title>Gestión · Boda Cris y Pela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root{--paper:#f7f0e2;--green:#737b54;--dark:#536048;--line:rgba(115,123,84,.3)}
      *{box-sizing:border-box}
      [hidden]{display:none!important}
      body{margin:0;min-height:100vh;color:var(--dark);background:var(--paper);font:400 14px/1.5 "DM Sans",system-ui,sans-serif}
      h1,h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500}
      button{font:inherit;cursor:pointer}
      .login{min-height:100vh;display:grid;place-items:center;padding:24px}
      .login form{width:min(360px,100%);padding:38px 32px;background:#faf5e9;border:1px solid var(--line);box-shadow:0 8px 22px rgba(76,67,48,.08)}
      .login h1{margin-bottom:24px;font-size:36px;text-align:center}
      label{display:block;margin-bottom:16px}
      label span{display:block;margin-bottom:5px;font:italic 500 17px "Cormorant Garamond",Georgia,serif}
      input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:2px;color:var(--dark);background:#fffdf7;font:inherit}
      input:focus{outline:2px solid var(--green);outline-offset:1px}
      .primary{width:100%;padding:11px 20px;border:1px solid var(--green);border-radius:2px;color:var(--paper);background:var(--green);font:500 17px "Cormorant Garamond",Georgia,serif}
      .secondary{padding:9px 18px;border:1px solid var(--green);border-radius:2px;color:var(--green);background:transparent;font:500 16px "Cormorant Garamond",Georgia,serif}
      .primary:disabled,.secondary:disabled{opacity:.55;cursor:wait}
      .back{display:inline-block;color:var(--green);font:italic 500 17px "Cormorant Garamond",Georgia,serif;text-decoration:none;border-bottom:1px solid var(--line)}
      .back:hover{border-color:var(--green)}
      .login .back{display:block;width:fit-content;margin:18px auto 0}
      .panel>.back{margin-bottom:18px}
      .error{min-height:1.5em;margin:12px 0 0;color:#9a4a3a;text-align:center}
      .panel{padding:32px clamp(16px,4vw,48px)}
      .panel-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:24px}
      .panel-head h1{font-size:40px}
      .actions{display:flex;gap:10px;flex-wrap:wrap}
      .actions .primary{width:auto}
      .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
      .stat{padding:14px 16px;background:#faf5e9;border:1px solid var(--line)}
      .stat strong{display:block;font:500 30px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--green)}
      .stat span{font-size:12px}
      .table-wrap{overflow-x:auto;background:#fffdf7;border:1px solid var(--line)}
      table{width:100%;border-collapse:collapse;font-size:13px}
      th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
      td.long{min-width:200px;white-space:normal}
      th{position:sticky;top:0;color:var(--paper);background:var(--green);font-weight:500}
      tbody tr:nth-child(even){background:rgba(115,123,84,.05)}
      .empty{padding:30px;text-align:center;font:italic 18px "Cormorant Garamond",Georgia,serif}
      td.actions-cell{position:sticky;left:0;z-index:1;background:#fffdf7}
      tbody tr:nth-child(even) td.actions-cell{background:#f8f5ec}
      th:first-child{position:sticky;left:0;z-index:2}
      .delete{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:3px;color:#9a4a3a;background:transparent}
      .delete:hover{border-color:rgba(154,74,58,.4);background:rgba(154,74,58,.08)}
      .delete svg{width:17px;height:17px}
      td.actions-cell{width:1%;padding:4px 8px;vertical-align:middle}
      .confirm{width:min(400px,calc(100% - 32px));padding:28px 26px;border:1px solid var(--line);color:var(--dark);background:#faf5e9;box-shadow:0 12px 36px rgba(52,67,52,.18)}
      .confirm::backdrop{background:rgba(52,67,52,.35)}
      .confirm h2{margin-bottom:10px;font-size:28px}
      .confirm p{margin:0 0 22px}
      .confirm .buttons{display:flex;gap:10px;justify-content:flex-end}
      .danger{padding:9px 18px;border:1px solid #9a4a3a;border-radius:2px;color:#fff;background:#9a4a3a;font:500 16px "Cormorant Garamond",Georgia,serif}

      .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 20px;border-bottom:1px solid var(--line)}
      .tabs button{padding:9px 16px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--dark);font:500 18px "Cormorant Garamond",Georgia,serif}
      .tabs button.active{background:#faf5e9;border-color:var(--line);color:var(--green);margin-bottom:-1px;font-style:italic}
      #save-state{font-size:12px;opacity:.75}#save-state.bad{color:#9a4a3a;opacity:1;font-weight:500}
      .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
      .toolbar>input[type=search]{width:min(240px,100%)}
      .grow{flex:1}
      .count{padding:3px 12px;border-radius:12px;background:#e4ecd6;color:var(--dark);font-size:13px}
      .primary.sm,.secondary.sm{padding:4px 10px;font-size:14px}
      .toolbar .primary,.toolbar .secondary{width:auto}
      select{padding:8px 10px;border:1px solid var(--line);border-radius:2px;color:var(--dark);background:#fffdf7;font:inherit;max-width:100%}
      textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;color:var(--dark);background:#fffdf7;font:inherit}
      .filebtn{display:inline-block;cursor:pointer}
      .link{padding:2px 4px;border:0;background:none;color:var(--green);text-decoration:underline;font-size:13px}
      .muted{opacity:.75;font-size:13px}
      table.edit td{padding:4px 6px}
      table.edit input,table.edit select{padding:6px 8px;min-width:110px;font-size:13px}
      table.edit input[type=number]{min-width:70px}
      .w60{width:70px!important;min-width:60px!important}.w80{width:90px!important;min-width:80px!important}.w100{width:110px!important}
      th .x{border:0;background:none;color:#fffdf7;opacity:.7;padding:0 2px;font-size:15px}
      .center{text-align:center}
      .pill{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:#faf5e9}
      .pill.ok{background:#e4ecd6;border-color:#b9c79c}.pill.warn{background:#f6e6c4;border-color:#dcc58f}
      select.v-si{background:#e4ecd6}select.v-no{background:#f1ddd6}
      details.assoc,details.group{margin:0 0 16px;background:#faf5e9;border:1px solid var(--line);padding:10px 14px}
      details summary{cursor:pointer;font:italic 500 19px "Cormorant Garamond",Georgia,serif}
      details>*:not(summary){margin-top:10px}
      .assoc-cell select{max-width:220px}
      .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
      .card{padding:14px;background:#faf5e9;border:1px solid var(--line)}
      .card-head,.card-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
      .card-head input[data-mf=nombre]{flex:1;min-width:120px}
      .card label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px}.card label.chk{margin:0}
      .mesa-svg{width:100%;height:auto;max-height:190px}
      .mesa-shape{fill:#efe6d2;stroke:var(--green);stroke-width:1.5}.mesa-num{font:italic 500 20px "Cormorant Garamond",Georgia,serif;fill:var(--dark)}
      .silla{fill:#fffdf7;stroke:var(--green)}.silla.ocupada{fill:var(--green)}.silla-t{font-size:8.5px;fill:var(--dark)}.silla.ocupada+.silla-t{fill:#fffdf7}
      .seats{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:5px}.seats select{width:100%;padding:5px 8px;font-size:13px}
      .cat{margin:0 0 22px}.cat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.cat-head h3{margin:0;font:italic 500 26px "Cormorant Garamond",Georgia,serif}
      .menu{display:flex;gap:6px;align-items:center;white-space:nowrap}
      .progress{height:8px;margin:0 0 16px;background:rgba(115,123,84,.2);border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
      .task{padding:8px 0;border-top:1px solid var(--line)}.task-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      .task-title{flex:1;min-width:180px;padding:4px 0;border:0;background:none;color:var(--dark);text-align:left;font-size:15px}
      .task.st-hecho .task-title{text-decoration:line-through;opacity:.6}
      .task select{padding:5px 8px;font-size:13px}
      .task select.est{min-width:116px}
      .task-note{margin:2px 0 0 4px}
      .detail{margin:10px 0 4px;padding:12px 14px;background:#fffdf7;border:1px solid var(--line)}
      .detail label{margin-bottom:10px}.detail label span{display:inline}
      .detail .chk{display:flex;gap:8px;align-items:center;margin-bottom:6px}.detail .chk input{width:auto}
      .opcion{padding:10px;margin-bottom:10px;border:1px solid var(--line)}.opcion.descartada{opacity:.5}.opcion.contratada{border-color:var(--green);background:#eef2e4}
      .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
      .danger-t{color:#9a4a3a}
      .tr.auto,tr.auto td{background:#f1f4e8}
      dialog.form{width:min(440px,calc(100% - 32px));padding:24px;border:1px solid var(--line);color:var(--dark);background:#faf5e9}
      dialog.form::backdrop{background:rgba(52,67,52,.35)}
      dialog.form h2{margin-bottom:14px;font-size:28px}
      dialog.form label{margin-bottom:12px}

      .table-wrap.tall{max-height:72vh;overflow:auto}
      .table-wrap.tall thead th{position:sticky;top:0;z-index:3}
      table.edit{font-size:13px}
      table.edit td{padding:2px 4px;white-space:nowrap}
      table.edit input,table.edit select{width:100%;min-width:0;padding:5px 8px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:13px}
      table.edit input:hover,table.edit select:hover{border-color:var(--line)}
      table.edit input:focus{background:#fffdf7;border-color:var(--green)}
      table.edit select{appearance:none;-webkit-appearance:none;border-radius:12px;padding:4px 10px;text-align:center;text-align-last:center;cursor:pointer;background-color:transparent}
      table.edit select[style]{border-color:rgba(83,96,72,.12)}
      table.edit .c-nombre{min-width:130px}table.edit .c-apellido{min-width:190px}
      table.edit td:nth-child(n+4):nth-child(-n+8) select{min-width:112px}
      table.edit td.center{min-width:150px;white-space:normal}
      table.edit input[data-gf=subgrupo]{min-width:190px}
      table.edit th{padding:9px 10px;white-space:nowrap}
      table.edit tbody tr:hover{background:rgba(115,123,84,.09)}
      .assoc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
      .chips{display:flex;gap:6px;flex-wrap:wrap}
      .chip{padding:4px 12px;border:1px solid var(--line);border-radius:14px;background:#fffdf7;color:var(--dark);font:500 13px "DM Sans",sans-serif}
      .chip b{margin-left:4px;font-weight:500;opacity:.65}.chip.on{background:var(--green);border-color:var(--green);color:var(--paper)}
      .mini{padding:5px 13px;border:1px solid var(--line);border-radius:14px;color:var(--dark);background:#fffdf7;font:500 12.5px "DM Sans",sans-serif;cursor:pointer;width:auto}
      select.mini{max-width:190px;padding:5px 10px}
      .mini.solid{background:var(--green);border-color:var(--green);color:var(--paper)}.mini.ghost{border-color:transparent;background:transparent;color:var(--green);text-decoration:underline}
      .mini:disabled{opacity:.45;cursor:default}
      .assoc-list{max-height:60vh;overflow:auto;background:#fffdf7;border:1px solid var(--line);border-radius:8px}
      .assoc-row{display:grid;grid-template-columns:38px minmax(150px,1fr) auto;gap:6px 14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}.assoc-row:last-child{border-bottom:0}
      .assoc-row.is-linked{background:rgba(196,214,160,.15)}
      .avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font:600 12px "DM Sans",sans-serif;color:var(--dark)}
      .who strong{display:block;font:500 14px "DM Sans",sans-serif;color:var(--dark)}.who small{font-size:12px;opacity:.85}
      .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
      .sug{font-size:13px}.sug.none{opacity:.65;font-style:italic}
      .pill.no{background:#f3d9d2;border-color:#e0b7ab}
      @media(max-width:720px){.assoc-row{grid-template-columns:38px 1fr}.st{grid-column:1/-1;justify-content:flex-start}}
      .filters{margin:0 0 16px;padding:12px 14px;background:#faf5e9;border:1px solid var(--line);border-radius:8px;display:grid;gap:9px}
      .frow{display:flex;gap:12px;align-items:baseline}.flabel{flex:0 0 98px;font:italic 500 16px "Cormorant Garamond",Georgia,serif;color:var(--green)}
      .fchips{display:flex;flex-wrap:wrap;gap:6px}
      .fchip{padding:4px 12px;border:1px solid rgba(83,96,72,.14);border-radius:14px;background:var(--c,#fffdf7);color:var(--dark);font:500 12.5px "DM Sans",sans-serif;cursor:pointer;opacity:.85}
      .fchip b{margin-left:5px;font-weight:500;opacity:.6}.fchip:hover{opacity:1}
      .fchip.on{opacity:1;border-color:var(--dark);box-shadow:0 0 0 1px var(--dark) inset;font-weight:600}
      @media(max-width:720px){.frow{flex-direction:column;gap:4px}}
      .undo{display:inline-flex;gap:6px}
      #modo{height:34px;padding:0 14px;border-radius:17px;font:500 13px "DM Sans",sans-serif;width:auto}
      /* Botones de las barras: mismo tamaño, tipo y alineación */
      .toolbar .primary,.toolbar .secondary,label.filebtn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:18px;font:500 13.5px "DM Sans",sans-serif;line-height:1;white-space:nowrap;cursor:pointer;width:auto;margin:0}
      .toolbar .primary{border:1px solid var(--green)}
      label.filebtn input{display:none}
      .toolbar .secondary:hover,label.filebtn:hover{background:rgba(115,123,84,.1)}
      .toolbar .primary:hover{background:var(--dark)}
      .toolbar{gap:8px 8px}
      .toolbar>input[type=search]{height:36px;border-radius:18px;padding:0 16px;width:min(260px,100%)}
      .mini:disabled{opacity:.4}
      .grow{display:grid;min-width:240px;max-width:420px}
      .grow::after,.grow textarea.cell-text{grid-area:1/1;padding:5px 8px;border:1px solid transparent;border-radius:4px;font:13px/1.4 "DM Sans",system-ui,sans-serif;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
      .grow::after{content:attr(data-v) " ";visibility:hidden;min-height:30px}
      textarea.cell-text{width:100%;height:100%;min-height:30px;resize:none;overflow:hidden;background:transparent;color:var(--dark);margin:0}
      textarea.cell-text:hover{border-color:var(--line)}textarea.cell-text:focus{background:#fffdf7;border-color:var(--green);outline:0}
      table.edit td{vertical-align:top}
      .alerg{display:block;margin:3px 0 0 4px;padding:2px 9px;border-radius:10px;background:#f7e3c3;border:1px solid #dcc58f;color:#7a5a1f;font-size:12px;line-height:1.3}
      .seats li{display:block}.seat-print{display:none}
      .cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
      .mcard{padding:16px;background:#faf5e9;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(76,67,48,.05)}
      .mcard.pres{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
      .mcard header{display:flex;gap:10px;align-items:center;margin-bottom:12px}
      .mnum{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:50%;background:var(--green);color:var(--paper);font:italic 500 24px "Cormorant Garamond",Georgia,serif}
      .mcard header input{flex:1;min-width:0;height:38px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;font:italic 500 20px "Cormorant Garamond",Georgia,serif;color:var(--dark)}
      .mcard header input:hover,.mcard header input:focus{background:#fffdf7;border-color:var(--line)}
      .mopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
      .seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fffdf7}
      .seg button{padding:5px 12px;border:0;background:transparent;color:var(--dark);font:500 12.5px "DM Sans",sans-serif}.seg button.on{background:var(--green);color:var(--paper)}
      .stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:16px;background:#fffdf7}
      .stepper button{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--green);font-size:16px}.stepper span{padding:0 6px;font:500 12.5px "DM Sans",sans-serif}
      .numlab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin:0}.numlab input{width:56px;padding:4px 8px;border-radius:12px}
      .chipbtn{padding:5px 12px;border:1px solid var(--line);border-radius:16px;background:#fffdf7;color:var(--dark);font:500 12.5px "DM Sans",sans-serif}.chipbtn.on{background:#f3ecb8;border-color:var(--gold)}
      .mfill{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:12.5px}.mfill .bar{flex:1;height:7px;border-radius:4px;background:rgba(115,123,84,.2);overflow:hidden}.mfill .bar i{display:block;height:100%;background:var(--green)}
      .warn-t{color:#8a5a12;font-weight:600}
      .mseats{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
      .mseats li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--line);border-radius:10px;background:#fffdf7}
      .mseats li.ocupada{border-style:solid;background:#eef2e4}
      .mseats .sn{flex:0 0 24px;height:24px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--green);font-size:11px;color:var(--green)}
      .mseats li.ocupada .sn{background:var(--green);color:var(--paper)}
      .seatbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 4px;border:0;background:transparent;text-align:left;color:var(--dark);font:13.5px "DM Sans",sans-serif;cursor:pointer}
      .seatbtn em{font-style:normal;font-size:11.5px;opacity:.7}.seatbtn .libre{opacity:.55}.seatbtn:hover strong,.seatbtn:hover .libre{text-decoration:underline}
      .x2{border:0;background:transparent;color:#9a4a3a;font-size:18px;line-height:1;padding:0 4px}
      .mseats .alerg{margin:0}
      #seat-q{width:100%;height:40px;padding:0 14px;border-radius:20px;margin-bottom:8px}
      .seat-opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}.seat-opts .chk{display:flex;align-items:center;gap:6px;margin:0}.seat-opts input{width:auto}
      #seat-list{max-height:52vh;overflow:auto;padding-right:4px;margin-bottom:14px}
      dialog.form .buttons{display:flex;justify-content:flex-end;gap:10px}
      dialog.form{width:min(560px,calc(100% - 24px))}
      .sgroup{margin:0 0 14px}.sgroup h4{display:flex;justify-content:space-between;margin:0 0 6px;padding:5px 12px;border-radius:8px;font:600 13px "DM Sans",sans-serif;color:var(--dark)}.sgroup h4 span{font-weight:500;opacity:.65}
      .sgroup h5{margin:8px 0 4px 4px;font:italic 500 16px "Cormorant Garamond",Georgia,serif;color:var(--green)}
      .sguests{display:flex;flex-wrap:wrap;gap:6px}
      .sguests button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:14px;background:#fffdf7;color:var(--dark);font:13px "DM Sans",sans-serif;cursor:pointer}
      .sguests button:hover{background:var(--green);color:var(--paper);border-color:var(--green)}
      .sguests i{font-style:normal;font-size:11px;opacity:.7}.sguests i.al{color:#8a5a12;opacity:1}.sguests i.in{background:#efe6d2;border-radius:8px;padding:0 6px;color:var(--dark)}
      #alerts:empty{display:none}
      .alert{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin:0 0 18px;padding:12px 16px;border-radius:10px;border:1px solid #dcc58f;background:#fbefcf;color:#6b4d12}
      .alert.bad{border-color:#d9a79b;background:#f7ddd6;color:#7a2f20}
      .alert strong{display:block;margin-bottom:4px;font:600 14px "DM Sans",sans-serif}.alert ul{margin:0;padding-left:18px;font-size:13.5px}.alert li.venc b{color:#9a2f1f}
      tr.vence-mes td{background:#fbefcf!important}tr.vence-ya td{background:#f7ddd6!important}
      input.chk-big{width:20px;height:20px;min-width:0}
      /* ===== Móvil y tablet ===== */
      .fbtn,.moretoggle,.mobonly,.more-td{display:none}
      .actions-more{display:contents}
      .hide-m{display:inline}
      @media(max-width:1100px){
        .fbtn{display:inline-flex}
        .filters{display:none}.filters.open{display:grid}
        .fchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
        .fchip{flex:0 0 auto}
      }
      @media(max-width:900px){
        .panel{padding:18px 14px 110px}
        .panel-head{margin-bottom:14px}.panel-head h1{font-size:30px}
        .panel-head .actions{width:100%;justify-content:space-between}
        .tabs{flex-wrap:nowrap;overflow-x:auto;gap:2px;margin:0 -14px 14px;padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
        .tabs::-webkit-scrollbar{display:none}
        .tabs button{flex:0 0 auto;padding:9px 12px;font-size:17px;white-space:nowrap}
        .stats{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
        .stat{padding:8px 10px}.stat strong{font-size:22px}.stat span{font-size:11px;line-height:1.25}
        .toolbar{gap:8px}.toolbar .grow{display:none}
        .toolbar .primary,.toolbar .secondary,label.filebtn{height:40px}
        /* barra inferior de Invitados: buscador y filtros al alcance del pulgar */
        .tb-main{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(247,240,226,.97);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(76,67,48,.12);flex-wrap:nowrap;align-items:center}
        .tb-main #g-q{flex:1 1 auto;min-width:0;width:auto;height:42px}
        .tb-main .count,.tb-main .grow{display:none}
        .tb-main>.link{position:absolute;right:14px;bottom:calc(100% + 6px);padding:4px 12px;border-radius:14px;background:#fffdf7;border:1px solid var(--line);text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .hide-m{display:none}
        .tb-main .primary{width:44px;padding:0;font-size:22px}
        .moretoggle{display:inline-flex;width:44px;padding:0;font-size:20px}
        .actions-more{display:none}
        .actions-more.open{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;padding:12px;background:#faf5e9;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(52,67,52,.28)}
        .actions-more.open .secondary,.actions-more.open label.filebtn{width:100%}
        .filters,.filters.open{grid-template-columns:minmax(0,1fr)}.frow,.fchips{min-width:0}
        .panel-head .secondary{padding:5px 12px;font-size:15px}
        .filters.open{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;max-height:64vh;overflow-y:auto;box-shadow:0 10px 30px rgba(52,67,52,.28);padding:14px}
        .mobonly{display:inline-flex;justify-content:center;align-items:center;height:42px;border-radius:21px;margin-top:4px;position:sticky;bottom:0}
        .frow{flex-direction:column;gap:3px}.flabel{flex:none}
        .assoc-list{max-height:none}
        /* tablas -> tarjetas */
        .table-wrap,.table-wrap.tall{overflow:visible;max-height:none;border:0;background:transparent}
        table.edit,table.edit tbody{display:block;width:100%}
        table.edit thead{display:none}
        table.edit tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;position:relative;margin:0 0 12px;padding:12px 14px;background:#fffdf7;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 6px rgba(76,67,48,.05)}
        table.edit tr:hover{background:#fffdf7}
        table.edit td{display:block;min-width:0;padding:0!important;border:0;background:transparent!important}
        table.edit td::before{content:attr(data-label);display:block;margin:0 0 2px 4px;font:500 11px "DM Sans",sans-serif;opacity:.6;text-transform:none}
        table.edit td.empty::before,table.edit td.more-td::before,table.edit td.actions-cell::before{content:none}
        table.edit td.sec{display:none}table.edit tr.open td.sec{display:block}
        table.edit td.wide{grid-column:1/-1}
        table.edit td.actions-cell{position:absolute;top:6px;right:8px;left:auto;width:auto;grid-column:auto;z-index:2}
        table.edit tr>td:first-child,table.edit tr>td:nth-child(2){padding-top:2px!important}
        table.edit td.more-td{display:block;grid-column:1/-1}
        table.edit input:not([type=checkbox]),table.edit select,table.edit .grow{width:100%;min-width:0!important;max-width:none}
        table.edit input,table.edit select{height:40px;font-size:15px}
        table.edit input,table.edit .grow textarea.cell-text{border-color:var(--line);background:#fffdf7}
        table.edit .c-nombre,table.edit .c-apellido{font-weight:600}
        table.edit td.center{text-align:left;min-width:0}
        .more-btn{width:100%;height:36px;border:1px dashed var(--line);border-radius:18px;background:transparent;color:var(--green);font:500 13px "DM Sans",sans-serif}
        .menu{flex-wrap:wrap;white-space:normal}
        input.chk-big{width:26px;height:26px}
        .cat-head{gap:6px}.cat-head h3{font-size:22px}
        .cards{grid-template-columns:1fr!important}
        .mcard{padding:14px}
        .task-head{gap:6px}.task-title{flex:1 1 100%;order:-1;min-width:0}
        .task select{flex:1 1 40%}
        .detail .grid2{grid-template-columns:1fr}
        .alert{flex-direction:column;gap:8px}
        dialog.form{width:calc(100% - 16px);padding:16px}
        .assoc-row{grid-template-columns:38px 1fr}.assoc-row .st{grid-column:1/-1;justify-content:flex-start}
      }
      @media(min-width:640px) and (max-width:900px){table.edit tr{grid-template-columns:repeat(3,1fr)}table.edit td.wide{grid-column:1/-1}}
      @media(max-width:900px){.cat-head [data-act=p-ren]{margin-left:auto}.cat-head .grow{display:none}}
      /* Pantallas táctiles: bloqueado hasta pulsar «Editar» */
      .edit-btn{display:none}
      html.touch .edit-btn{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--green);border-radius:16px;background:#fffdf7;color:var(--green);font:500 12.5px "DM Sans",sans-serif;cursor:pointer;white-space:nowrap}
      html.touch .editing>.edit-btn,html.touch .editing .edit-btn{background:var(--green);color:var(--paper)}
      html.touch tr:not(.editing) input,html.touch tr:not(.editing) select,html.touch tr:not(.editing) textarea{pointer-events:none}
      html.touch table.edit tr:not(.editing) input:not([type=checkbox]),html.touch table.edit tr:not(.editing) textarea{background:transparent!important;border-color:transparent!important}
      html.touch table.edit tr:not(.editing) .delete{display:none}
      html.touch table.edit tr.editing{box-shadow:0 0 0 2px var(--green) inset}
      html.touch .mcard:not(.editing) .mopts,html.touch .mcard:not(.editing) .delete,html.touch .mcard:not(.editing) .x2{display:none}
      html.touch .mcard:not(.editing) header input{pointer-events:none}
      html.touch .mcard.editing{box-shadow:0 0 0 2px var(--green)}
      html.touch .mcard header .edit-btn{margin-left:auto}
      @media(max-width:900px){html.touch table.edit td.actions-cell{display:flex;gap:6px;align-items:center}}
      @media print{.mopts,.mfill,.x2,.seatbtn,.seg,.stepper{display:none!important}.mseats li{border:0;background:none;padding:2px 0}.mseats .sn{display:none}}
      @media print{.seat-print{display:block!important;visibility:visible}.alerg{display:none!important}.seats li{break-inside:avoid}}
      @media print{body *{visibility:hidden}#tab-mesas,#tab-mesas *{visibility:visible}#tab-mesas{position:absolute;left:0;top:0;width:100%}.toolbar,.assoc,.seats select{display:none!important}}
    </style>
  </head>
  <body>
    <main class="login" id="login-view">
      <form id="login-form">
        <h1>Zona privada</h1>
        <label><span>Usuario</span><input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
        <label><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required /></label>
        <button class="primary" type="submit">Entrar</button>
        <p class="error" id="login-error" role="alert"></p>
        <a class="back" href="/">← Volver a la web</a>
      </form>
    </main>

    <main class="panel" id="panel-view" hidden>
      <a class="back" href="/">← Volver a la web</a>
      <div class="panel-head">
        <h1>Gestión de la boda</h1>
        <div class="actions">
          <span id="undo-wrap" class="undo" hidden><button type="button" id="undo" class="mini" disabled>↶ Deshacer</button><button type="button" id="redo" class="mini" disabled>↷ Rehacer</button></span>
          <button type="button" id="modo" class="secondary" hidden></button>
          <span id="save-state" role="status"></span>
          <button class="secondary" id="logout" type="button">Cerrar sesión</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Secciones">
        <button type="button" data-tab="respuestas">Cuestionario</button>
        <button type="button" data-tab="invitados">Invitados</button>
        <button type="button" data-tab="mesas">Mesas</button>
        <button type="button" data-tab="presupuesto">Presupuesto</button>
        <button type="button" data-tab="proveedores">Proveedores</button>
        <button type="button" data-tab="tareas">Tareas</button>
      </nav>
      <div id="alerts"></div>

      <section class="tab" id="tab-respuestas">
        <div class="toolbar" id="actions-resp">
          <button class="primary" id="export" type="button">Exportar Excel</button>
          <button class="secondary" id="refresh" type="button">Actualizar</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrap"><table id="table"></table></div>
      </section>
      <section class="tab" id="tab-invitados" hidden></section>
      <section class="tab" id="tab-mesas" hidden></section>
      <section class="tab" id="tab-presupuesto" hidden></section>
      <section class="tab" id="tab-proveedores" hidden></section>
      <section class="tab" id="tab-tareas" hidden></section>

      <dialog class="confirm" id="confirm">
        <h2>¿Seguro?</h2>
        <p id="confirm-text"></p>
        <div class="buttons"><button class="secondary" id="confirm-cancel" type="button">Cancelar</button><button class="danger" id="confirm-ok" type="button">Eliminar</button></div>
      </dialog>

      <dialog class="form" id="dlg-col">
        <form id="dlg-col-form" method="dialog">
          <h2>Nueva columna</h2>
          <label><span>Nombre</span><input name="nombre" list="dlg-col-name" required /><datalist id="dlg-col-name"></datalist></label>
          <label><span>Tipo</span><select name="tipo"><option value="texto">Texto</option><option value="sino">Sí / No</option><option value="numero">Número</option><option value="lista">Listado de opciones</option></select></label>
          <label><span>Opciones (separadas por comas, solo para listado)</span><input name="opciones" /></label>
          <div class="buttons"><button class="secondary" id="dlg-col-cancel" type="button">Cancelar</button><button class="primary" type="submit" style="width:auto">Añadir</button></div>
        </form>
      </dialog>

      <dialog class="form" id="dlg-grupos">
        <form id="dlg-grupos-form" method="dialog">
          <h2>Grupos de invitados</h2>
          <label><span>Un grupo por línea</span><textarea name="grupos" rows="9"></textarea></label>
          <div class="buttons"><button class="secondary" id="dlg-grupos-cancel" type="button">Cancelar</button><button class="primary" type="submit" style="width:auto">Guardar</button></div>
        </form>
      </dialog>
    <dialog class="form" id="dlg-seat">
        <h2 id="seat-title">Elegir invitado</h2>
        <input id="seat-q" type="search" placeholder="Buscar por nombre, grupo o subgrupo…" autocomplete="off" />
        <div class="seat-opts"><label class="chk"><input type="checkbox" id="seat-seated" /> <span id="seat-all-label">Mostrar también los ya colocados</span></label><span class="muted" id="seat-count"></span></div>
        <div id="seat-list"></div>
        <div class="buttons"><button class="secondary" id="seat-close" type="button">Cerrar</button></div>
      </dialog>
    </main>

    <script src="/gestion-data.js?v=30"></script>
    <script src="/admin.js?v=30"></script>
  </body>
</html>
